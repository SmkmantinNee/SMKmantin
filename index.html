<!-- 游戏区域 --><h2>第1关</h2><p>找出7个常用字</p><div id="mainWord">田</div><div id="foundWords"></div><h3>请选择汉字</h3><div id="choices"><button onclick="pick('口')">口</button>
<button onclick="pick('日')">日</button>
<button onclick="pick('十')">十</button>
<button onclick="pick('木')">木</button>

<button onclick="pick('土')">土</button>
<button onclick="pick('一')">一</button>
<button onclick="pick('二')">二</button>
<button onclick="pick('水')">水</button>

<button onclick="pick('火')">火</button>
<button onclick="pick('山')">山</button>
<button onclick="pick('月')">月</button>
<button onclick="pick('人')">人</button>

</div><p id="msg"></p><script>

const answers=[
"田",
"口",
"日",
"十",
"土",
"一",
"二"
];

let found=[];

function pick(word){

if(found.includes(word)){
return;
}

if(answers.includes(word)){

found.push(word);

document.getElementById("foundWords")
.innerHTML +=
"<span style='background:green;color:white;padding:8px;margin:5px;border-radius:10px;'>"+word+"</span>";

document.getElementById("msg")
.innerHTML="✅ 找到了："+word;

if(found.length===answers.length){

document.getElementById("msg")
.innerHTML=
"🎉 过关成功！获得50金币";

}

}else{

document.getElementById("msg")
.innerHTML=
"❌ 不是答案";

}

}

</script><style>

body{
text-align:center;
font-family:Arial;
background:#87CEEB;
}

#mainWord{
font-size:100px;
font-weight:bold;
margin:20px;
}

button{
width:70px;
height:70px;
margin:5px;
font-size:28px;
border:none;
border-radius:15px;
background:#FFD54F;
}

#foundWords{
margin:20px;
}

</style>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼词王</title>

<style>
body{
font-family:Arial;
background:#4CAF50;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:20px;
border-radius:15px;
width:90%;
max-width:400px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:5px 0;
}

button{
padding:10px 20px;
margin:5px;
background:#4CAF50;
color:white;
border:none;
border-radius:8px;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<!-- 登录 -->
<div class="box" id="loginPage">

<h2>拼词王</h2>

<input id="loginUser" placeholder="用户名">

<input id="loginPass" type="password" placeholder="密码">

<br>

<button onclick="login()">登录</button>

<button onclick="showRegister()">注册</button>

<p id="loginMsg"></p>

</div>

<!-- 注册 -->
<div class="box hidden" id="registerPage">

<h2>注册账号</h2>

<input id="regUser" placeholder="用户名">

<input id="regPass" type="password" placeholder="密码">

<br>

<button onclick="register()">注册</button>

<button onclick="showLogin()">返回</button>

<p id="regMsg"></p>

</div>

<!-- 大厅 -->
<div class="box hidden" id="lobby">

<h2>🏠 游戏大厅</h2>

<p id="playerName"></p>

<p>🪙 金币：100</p>

<p>💡 提示卡：0</p>

<p>🏆 当前关卡：1</p>

<button>开始游戏</button>

</div>

<script>

function showRegister(){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("registerPage").classList.remove("hidden");
}

function showLogin(){
document.getElementById("registerPage").classList.add("hidden");
document.getElementById("loginPage").classList.remove("hidden");
}

function register(){

let user=document.getElementById("regUser").value;
let pass=document.getElementById("regPass").value;

if(user===""||pass===""){
document.getElementById("regMsg").innerHTML="请填写完整";
return;
}

localStorage.setItem(
"user_"+user,
JSON.stringify({
username:user,
password:pass,
coins:100,
hints:0,
level:1
})
);

document.getElementById("regMsg").innerHTML="注册成功！";
}

function login(){

let user=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;

let data=localStorage.getItem("user_"+user);

if(!data){
document.getElementById("loginMsg").innerHTML="账号不存在";
return;
}

data=JSON.parse(data);

if(data.password!==pass){
document.getElementById("loginMsg").innerHTML="密码错误";
return;
}

document.getElementById("loginPage").classList.add("hidden");
document.getElementById("lobby").classList.remove("hidden");

document.getElementById("playerName").innerHTML=
"👤 玩家："+data.username;
}

</script>

</body>
</html>
